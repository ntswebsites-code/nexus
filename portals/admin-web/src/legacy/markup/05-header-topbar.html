<header class="topbar">
<button aria-label="Open menu" class="mobile-menu icon-btn" id="mobileMenu">☰</button>
<div class="global-search">
<svg><use href="#i-search"></use></svg>
<input id="globalSearch" placeholder="Search portfolios, private assets, securities, orders, models, counterparties or documents…" type="search"/>
<kbd>⌘ K</kbd>
</div>
<div class="topbar-right">
<div class="market-clock"><span class="live-dot"></span><div><strong id="marketStatus">ZSE market open</strong><small id="localClock">15:24 CAT</small></div></div>
<button aria-label="Notifications" class="icon-btn notify-btn"><svg><use href="#i-bell"></use></svg><span>4</span></button>
<div class="role-control">
<label for="roleSwitcher">Viewing as</label>
<select aria-label="Demo role" id="roleSwitcher">
<option value="investment_director">Investment Director</option>
<option value="portfolio_manager">Portfolio Manager</option>
<option value="dealer">Dealer / Trader</option>
<option value="analyst">Investment Analyst</option>
<option value="compliance">Compliance Officer</option>
<option value="operations">Operations</option>
<option value="fund_accountant">Fund Accountant</option>
<option value="client_services">Client Services</option>
<option value="auditor">Auditor</option>
<option value="system_admin">System Administrator</option>
</select>
</div>
<button class="profile-button" id="profileButton">
<span class="avatar">TM</span>
<span class="profile-copy"><strong>Tendai Moyo</strong><small id="roleLabel">Investment Director</small></span>
<span>⌄</span>
</button>
</div>
</header>
