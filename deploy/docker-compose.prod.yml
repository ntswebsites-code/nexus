# Production stack for Matanho Nexus.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Secrets live in ../.env.production (see deploy/.env.production.example) and
# ../secrets/users.json - both stay on the server and are never committed.
# App ports bind to 127.0.0.1 only; the host nginx terminates TLS.
#
# Every app service reads ../.env.production through `env_file`, so the runtime flags
# (LP_LIVE_DOMAINS, INVESTEE_LIVE_ACTIONS, CUSTODIAN_LIVE, ONBOARDING_LIVE), the portal
# URLs (incl. CUSTODIAN_PORTAL_URL) and SMTP_* pass straight through. They are not repeated
# under `environment:` on purpose: an `environment:` entry would override the env file, and
# an unset interpolation would silently blank a flag. Flag rollback = edit the env file and
# `up -d --no-deps api` (deploy/rollback.sh --flags-off does both).
#
# Deploy and rollback: deploy/deploy.sh and deploy/rollback.sh (DEV-PLAN section 8).
name: matanho-nexus

x-app-env: &app-env
  env_file: ../.env.production
  restart: unless-stopped

x-portal-build: &portal-build
  context: ..
  dockerfile: deploy/Dockerfile.portal
  target: portal

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ../.env.production
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: matanho-nexus-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: api
    env_file: ../.env.production
    environment:
      SEED_USERS_FILE: /run/secrets/users.json
      STORAGE_DIR: /data/storage
    volumes:
      - ../secrets/users.json:/run/secrets/users.json:ro
      - file-storage:/data/storage
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && npx tsx prisma/seed.ts"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-env
    image: matanho-nexus-api:latest
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - file-storage:/data/storage
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Outbox worker: notifications, email, screening stub (SRD 10.2).
  worker:
    <<: *app-env
    image: matanho-nexus-api:latest
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - file-storage:/data/storage
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    <<: *app-env
    image: matanho-nexus-admin:latest
    build:
      <<: *portal-build
      args:
        PORTAL: admin-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nexus.matanho.com}
    environment:
      PORT: "3100"
    ports:
      - "127.0.0.1:3100:3100"
    depends_on: [api]

  investor:
    <<: *app-env
    image: matanho-nexus-investor:latest
    build:
      <<: *portal-build
      args:
        PORTAL: investor-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nexus.matanho.com}
    environment:
      PORT: "3101"
    ports:
      - "127.0.0.1:3101:3101"
    depends_on: [api]

  onboarding:
    <<: *app-env
    image: matanho-nexus-onboarding:latest
    build:
      <<: *portal-build
      args:
        PORTAL: onboarding-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nexus.matanho.com}
    environment:
      PORT: "3102"
    ports:
      - "127.0.0.1:3102:3102"
    depends_on: [api]

  company:
    <<: *app-env
    image: matanho-nexus-company:latest
    build:
      <<: *portal-build
      args:
        PORTAL: company-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nexus.matanho.com}
    environment:
      PORT: "3103"
    ports:
      - "127.0.0.1:3103:3103"
    depends_on: [api]

  custodian:
    <<: *app-env
    image: matanho-nexus-custodian:latest
    build:
      <<: *portal-build
      args:
        PORTAL: custodian-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nexus.matanho.com}
    environment:
      PORT: "3104"
    ports:
      - "127.0.0.1:3104:3104"
    depends_on: [api]

  # UAT mail capture (DEV-PLAN D9): the API and worker send to mailpit:1025 on the compose
  # network (SMTP_HOST=mailpit, SMTP_PORT=1025) and nothing leaves the host. No hostname and
  # no certificate: the web UI / API is bound to 127.0.0.1 only and is reached through an SSH
  # tunnel (ssh -L 8625:127.0.0.1:8625 root@<host>), or from inside the network at
  # http://mailpit:8025 (the smoke suite's S12 check uses that).
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8625}:8025"

  # S3-compatible object storage (MinIO). The S3 API (9000) is reachable only on the compose
  # network as http://minio:9000; the console is bound to 127.0.0.1 and reached through an
  # SSH tunnel. Root credentials (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD) and the app's
  # STORAGE_S3_* keys live in ../.env.production on the server, never in git.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e  # RELEASE.2025-09-07T16-13-09Z (Docker Hub no longer serves release tags; pinned by digest)
    restart: unless-stopped
    env_file: ../.env.production
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19101}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot, idempotent: private buckets, versioning on nexus-documents, and a least-privilege
  # app user (STORAGE_S3_ACCESS_KEY / STORAGE_S3_SECRET_KEY) limited to those buckets.
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727  # RELEASE.2025-08-13T08-35-41Z
    env_file: ../.env.production
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        for b in nexus-documents nexus-esign nexus-exports; do mc mb --ignore-existing local/$$b; mc anonymous set none local/$$b >/dev/null; done
        mc version enable local/nexus-documents
        cat > /tmp/nexus-app.json <<'POLICY'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::nexus-documents","arn:aws:s3:::nexus-documents/*","arn:aws:s3:::nexus-esign","arn:aws:s3:::nexus-esign/*","arn:aws:s3:::nexus-exports","arn:aws:s3:::nexus-exports/*"]}]}
        POLICY
        mc admin policy create local nexus-app /tmp/nexus-app.json || true
        mc admin user add local "$$STORAGE_S3_ACCESS_KEY" "$$STORAGE_S3_SECRET_KEY" || true
        mc admin policy attach local nexus-app --user "$$STORAGE_S3_ACCESS_KEY" || true
        mc ls local

volumes:
  minio-data:
  mysql-data:
  # AES-256-GCM encrypted objects (documents, KYC evidence, submissions).
  file-storage:
