# Matanho Nexus DEV - six hostnames on one host (nip.io), each proxied to a Docker container
# bound to 127.0.0.1. Certbot rewrites this file in place when it issues certificates.
#
#   dev.207.180.234.151.nip.io             -> 127.0.0.1:13100  admin workspace (main entry)
#   investor.dev.207.180.234.151.nip.io    -> 127.0.0.1:13101  investor portal
#   onboarding.dev.207.180.234.151.nip.io  -> 127.0.0.1:13102  public onboarding
#   company.dev.207.180.234.151.nip.io     -> 127.0.0.1:13103  portfolio company portal
#   custodian.dev.207.180.234.151.nip.io   -> 127.0.0.1:13104  custodian submissions
#   dev-api.207.180.234.151.nip.io         -> 127.0.0.1:14100  shared API (dev)

gzip_min_length 256;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

server {
    listen 80;
    listen [::]:80;
    server_name dev.207.180.234.151.nip.io;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

