# Matanho Nexus - six hostnames on one host, each proxied to a Docker container
# bound to 127.0.0.1. Certbot rewrites this file in place when it issues certificates.
#
#   nexus.matanho.com             -> 127.0.0.1:3100  admin workspace (main entry)
#   investor.nexus.matanho.com    -> 127.0.0.1:3101  investor portal
#   onboarding.nexus.matanho.com  -> 127.0.0.1:3102  public onboarding
#   company.nexus.matanho.com     -> 127.0.0.1:3103  portfolio company portal
#   custodian.nexus.matanho.com   -> 127.0.0.1:3104  custodian submissions
#   api.nexus.matanho.com         -> 127.0.0.1:4100  shared API

gzip_min_length 256;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

server {
    listen 80;
    listen [::]:80;
    server_name nexus.matanho.com;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

